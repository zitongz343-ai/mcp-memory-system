<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Mnemosyne · 记忆</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%235a9b96'/%3E%3Ccircle cx='50' cy='50' r='16' fill='none' stroke='white' stroke-width='6'/%3E%3Cpath d='M50 14 A36 36 0 0 1 86 50' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景光晕 -->
  <div class="bg-blobs"><div class="b3"></div></div>

  

  <!-- 顶栏 -->
  <header class="topbar">
    <div style="display:flex;align-items:center;">
      <div class="topbar-title">Mnemo<span>syne</span></div>
      <span class="topbar-sub">Personal Memory</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题"></button>
    </div>
  </header>

  <!-- ============ 首页 ============ -->
  <section class="page active" id="page-home">
    <div class="hero">
      <div class="hero-logo" id="heroLogo"></div>
      <div class="hero-title">Mnemo<span>syne</span></div>
      <div class="hero-quote" id="homeQuote"></div>
      <div class="hero-stats" id="homeStats"></div>
    </div>
    <div class="section">
      <div class="section-title" id="entryTitle">快速入口</div>
            <div class="entry-grid">
        <div class="entry-card" onclick="switchPage('dashboard')">
          <div class="ec-icon" data-icon="chart"></div>
          <div class="t">记忆看板</div><div class="d">热力图 · 月度报告</div>
        </div>
        <div class="entry-card" onclick="switchPage('memories')">
          <div class="ec-icon" data-icon="memory"></div>
          <div class="t">全部记忆</div><div class="d">搜索 · 筛选 · 编辑</div>
        </div>
        <div class="entry-card" onclick="switchPage('cloud')">
          <div class="ec-icon" data-icon="wordcloud"></div>
          <div class="t">词云</div><div class="d">高频主题回顾</div>
        </div>
        <div class="entry-card" onclick="switchPage('breath')">
          <div class="ec-icon" data-icon="breath"></div>
          <div class="t">呼吸</div><div class="d">核心记忆浮现</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 看板 ============ -->
  <section class="page" id="page-dashboard">
    <div class="section">
      <div class="section-title">记忆热力图</div>
      <div class="glass heatmap-wrapper">
        <div class="heatmap-grid" id="heatmapGrid"></div>
        <div class="heatmap-labels">
          <span>少</span>
          <div class="heatmap-legend">
            <span style="background:#e3efed;"></span>
            <span style="background:#b8d9d5;"></span>
            <span style="background:#7ab8b2;"></span>
            <span style="background:#4a8f89;"></span>
            <span style="background:#2f5f5a;"></span>
          </div>
          <span>多</span>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">月度报告</div>
      <div class="glass report-card" id="reportCard">加载中...</div>
    </div>
  </section>

  <!-- ============ 记忆 ============ -->
  <section class="page" id="page-memories">
        <div class="toolbar">
      <input class="search-box" id="search" placeholder="搜索记忆（支持多关键词，空格分隔）" oninput="onSearch()">
      <button class="btn" onclick="openCalendar()"><span class="ic" data-icon="calendar"></span>日历</button>
      <button class="btn" onclick="refreshList()"><span class="ic" data-icon="refresh"></span>刷新</button>
      <button class="btn" onclick="showAddModal()"><span class="ic" data-icon="plus"></span>新增</button>
      <button class="btn" onclick="showImportModal()"><span class="ic" data-icon="import"></span>导入</button>
      <button class="btn" onclick="showExportMenu()"><span class="ic" data-icon="export"></span>导出</button>
      <button class="btn btn-danger" onclick="confirmClear()"><span class="ic" data-icon="trash"></span>清空</button>
    </div>
    <div class="sort-bar">
      <div>
        <span class="label">排序：</span>
        <button class="btn btn-sm" id="sortNewest" onclick="setSort('newest')" style="background:var(--accent);color:#fff;border-color:var(--accent);">最新</button>
        <button class="btn btn-sm" id="sortOldest" onclick="setSort('oldest')">最旧</button>
        <button class="btn btn-sm" id="sortPinned" onclick="setSort('pinned')">置顶优先</button>
      </div>
      <span class="stats-text"><strong id="count">加载中...</strong> <span id="wordCount"></span></span>
    </div>
    <div class="tag-filter-bar" id="tagFilterBar"></div>
    <div class="card-grid" id="list">
      <div class="empty-state"><p>加载中...</p></div>
    </div>
  </section>

  <!-- 日历弹层 -->
  <div class="calendar-overlay" id="calendarOverlay" onclick="if(event.target===this)closeCalendar()">
    <div class="calendar-panel">
      <div class="cal-header">
        <div class="cal-month" id="calMonthLabel" onclick="toggleCalPicker()"></div>
        <button class="cal-close" onclick="closeCalendar()">✕</button>
      </div>
      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-days" id="calDays"></div>
      <div class="cal-footer">
        <button class="cal-today-btn" onclick="calGoToday()">回到今天</button>
        <button class="cal-clear-btn" onclick="calClearDate()">显示全部</button>
      </div>
    </div>
  </div>


  <!-- ============ 词云 ============ -->
  <section class="page" id="page-cloud">
    <div class="section">
      <div class="section-title">高频词云</div>
      <div class="glass wordcloud-box" id="wordcloudBox">加载中...</div>
    </div>
  </section>

  <!-- ============ 呼吸 ============ -->
  <section class="page" id="page-breath">
    <div class="section">
      <div class="section-title">呼吸 · 核心记忆浮现</div>
      <div id="breathBox"></div>
    </div>
  </section>

  <!-- 底栏 -->
  <nav class="bottombar">
    <button class="nav-item active" data-page="home" onclick="switchPage('home')">首页</button>
    <button class="nav-item" data-page="dashboard" onclick="switchPage('dashboard')">看板</button>
    <button class="nav-item" data-page="memories" onclick="switchPage('memories')">记忆</button>
    <button class="nav-item" data-page="cloud" onclick="switchPage('cloud')">词云</button>
    <button class="nav-item" data-page="breath" onclick="switchPage('breath')">呼吸</button>
  </nav>

  <input type="file" id="fileInput" accept=".json" onchange="handleImport(event)">
  <script src="app.js"></script>
</body>
</html>
